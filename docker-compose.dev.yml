services:
  mongo:
    # Exposed so tests and `npm run seed` on the host can reach it.
    ports:
      - "27017:27017"

  app:
    build:
      target: deps
    # webpack + polling: file events from bind mounts (e.g. Docker Desktop on Windows)
    # do not reach the container, and Turbopack has no polling fallback.
    command: npm run dev -- --webpack
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      ENABLE_TEST_ENDPOINTS: "true"
    # Anonymous volumes keep the container's node_modules and .next apart from the host's, so a
    # host `next dev` or `next build` never fights the container over .next/dev.
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
