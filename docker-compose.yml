services:
  mongo:
    image: mongo:8
    # mongod can't log below info level; drop "s":"I" lines so only warnings/errors show.
    # exec keeps mongod as PID 1 so `docker stop` still shuts it down cleanly.
    command: ["bash", "-c", "exec docker-entrypoint.sh mongod > >(grep --line-buffered -v '\"s\":\"I\"')"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 2s

  seed:
    build:
      context: .
      target: seed
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: feature_flags
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: feature_flags
      ENABLE_TEST_ENDPOINTS: "false"
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  mongo-data:
