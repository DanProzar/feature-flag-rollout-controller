services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: feature_flags
      ENABLE_TEST_ENDPOINTS: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
